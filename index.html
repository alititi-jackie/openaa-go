  <script>
    (()=>{
      "use strict";
      const STORAGE_KEY="openaa-go-search-engine";
      const form=document.getElementById("searchForm"),input=document.getElementById("searchInput"),select=document.getElementById("engineSelect"),tabs=Array.from(document.querySelectorAll(".engine-tab")),shareButton=document.getElementById("shareButton"),installButton=document.getElementById("installButton"),navButton=document.getElementById("navButton"),navMenu=document.getElementById("navMenu");
      let deferredInstallPrompt=null;
      const engines={google:{placeholder:"搜索网页或华人生活信息",buildUrl:q=>"https://www.google.com/search?q="+encodeURIComponent(q)},bing:{placeholder:"使用 Bing 搜索",buildUrl:q=>"https://www.bing.com/search?q="+encodeURIComponent(q)},baidu:{placeholder:"使用百度搜索",buildUrl:q=>"https://www.baidu.com/s?wd="+encodeURIComponent(q)},ai:{placeholder:"使用 AI 搜索",buildUrl:q=>"https://www.perplexity.ai/search?q="+encodeURIComponent(q)},openaa:{placeholder:"搜索 OpenAA 华人生活信息",buildUrl:q=>"https://openaa.com/search?q="+encodeURIComponent(q)}};
      function normalizeEngine(v){return Object.prototype.hasOwnProperty.call(engines,v)?v:"google"}
      function setEngine(k,focus=false){k=normalizeEngine(k);select.value=k;input.placeholder=engines[k].placeholder;tabs.forEach(t=>t.setAttribute("aria-pressed",t.dataset.engine===k?"true":"false"));try{localStorage.setItem(STORAGE_KEY,k)}catch(_){}if(focus)input.focus()}
      function getSavedEngine(){try{return normalizeEngine(localStorage.getItem(STORAGE_KEY))}catch(_){return"google"}}
      function looksLikeUrl(v){return /^(https?:\/\/)/i.test(v)||/^(localhost)(:\d+)?(\/.*)?$/i.test(v)||/^[a-z0-9-]+(\.[a-z0-9-]+)+([/:?#].*)?$/i.test(v)}
      function toUrl(v){return /^https?:\/\//i.test(v)?v:"https://"+v}
      async function copyText(value){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(value);return true}catch(_){}}const ta=document.createElement("textarea");ta.value=value;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.top="-9999px";document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand("copy")}catch(_){}ta.remove();return ok}
      function closeNav(){navMenu.hidden=true;navButton.setAttribute("aria-expanded","false")}
      navButton.addEventListener("click",e=>{e.stopPropagation();const open=navMenu.hidden;navMenu.hidden=!open;navButton.setAttribute("aria-expanded",open?"true":"false")});
      navMenu.addEventListener("click",e=>e.stopPropagation());document.addEventListener("click",closeNav);document.addEventListener("keydown",e=>{if(e.key==="Escape")closeNav()});
      select.addEventListener("change",()=>setEngine(select.value,true));tabs.forEach(t=>t.addEventListener("click",()=>setEngine(t.dataset.engine,true)));
      form.addEventListener("submit",e=>{e.preventDefault();const q=input.value.trim();if(!q){input.focus();return}const url=looksLikeUrl(q)?toUrl(q):engines[normalizeEngine(select.value)].buildUrl(q);const opened=window.open(url,"_blank","noopener,noreferrer");if(opened)opened.opener=null});
      shareButton.addEventListener("click",async()=>{const data={title:"OpenAA · 美国华人生活入口",text:"搜索网络，也搜索华人生活",url:location.href};if(navigator.share){try{await navigator.share(data);return}catch(e){if(e&&e.name==="AbortError")return}}const ok=await copyText(location.href);alert(ok?"链接已复制":"当前浏览器不支持分享，请手动复制地址栏链接。")});
      window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredInstallPrompt=e});
      window.addEventListener("appinstalled",()=>{deferredInstallPrompt=null;installButton.disabled=true;installButton.title="已安装";installButton.setAttribute("aria-label","已安装")});
      installButton.addEventListener("click",async()=>{if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(_){}deferredInstallPrompt=null;return}if(/iPad|iPhone|iPod/.test(navigator.userAgent)){alert("iPhone / iPad：点浏览器的“分享”按钮，再选择“添加到主屏幕”。");return}alert("如没有弹出安装窗口，请使用 Chrome / Edge 浏览器菜单中的“安装此应用”或“创建快捷方式”，即可放到桌面。")});
      setEngine(getSavedEngine());
    })();
  </script>
