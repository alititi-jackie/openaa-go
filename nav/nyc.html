  <script>
    const PLACES = [
      ['景点', '中央公园 Central Park', '纽约著名城市公园，适合散步、拍照和休闲。', 'Columbus Circle, New York, NY 10019'],
      ['景点', '时代广场 Times Square', '纽约经典地标和夜景区域。', 'Times Square, New York, NY 10036'],
      ['景点', '自由女神 / Battery Park', '前往自由女神游船常用出发区域。', 'Battery Park, New York, NY 10004'],
      ['景点', '华尔街铜牛 Charging Bull', '华尔街著名铜牛雕塑。', 'Bowling Green, New York, NY 10004'],
      ['景点', '世贸中心 / 9·11 纪念馆', '世贸中心、纪念馆和 Oculus 所在区域。', '180 Greenwich St, New York, NY 10007'],
      ['景点', '布鲁克林大桥 Brooklyn Bridge', '经典步行地标，可看曼哈顿天际线。', 'Brooklyn Bridge, New York, NY 10038'],
      ['景点', 'DUMBO 经典拍照点', '华盛顿街曼哈顿大桥经典取景位。', 'Washington St & Water St, Brooklyn, NY 11201'],
      ['景点', '法拉盛草原可乐娜公园', '皇后区大型公园，Unisphere 所在地。', 'Flushing Meadows Corona Park, Queens, NY 11368'],
      ['景点', '罗斯福岛 Roosevelt Island', '可乘缆车欣赏曼哈顿景色。', 'Roosevelt Island, New York, NY 10044'],
      ['景点', '康尼岛 Coney Island', '布鲁克林海滨、沙滩和游乐区。', 'Coney Island Boardwalk, Brooklyn, NY 11224'],
      ['购物', 'American Dream 美国梦购物中心', '新泽西大型购物和室内娱乐中心。', '1 American Dream Way, East Rutherford, NJ 07073'],
      ['购物', 'Roosevelt Field 罗斯福购物中心', '长岛大型室内购物中心。', '630 Old Country Rd, Garden City, NY 11530'],
      ['购物', 'Queens Center 皇后中心', '皇后区常去大型商场。', '90-15 Queens Blvd, Elmhurst, NY 11373'],
      ['购物', 'The Shops at Hudson Yards', '曼哈顿西区大型购物中心。', '20 Hudson Yards, New York, NY 10001'],
      ['购物', 'Westfield World Trade Center', '位于 Oculus 内的世贸购物中心。', '185 Greenwich St, New York, NY 10007'],
      ['购物', 'Woodbury Common 名牌折扣村', '纽约周边热门品牌 Outlet。', '498 Red Apple Ct, Central Valley, NY 10917'],
      ['购物', 'Jersey Gardens 泽西花园', '新泽西大型 Outlet 商场。', '651 Kapkowski Rd, Elizabeth, NJ 07201'],
      ['品牌店', 'Gucci Fifth Avenue 古驰', 'Gucci 第五大道品牌店。', '725 Fifth Ave, New York, NY 10022'],
      ['品牌店', 'Tiffany & Co. 蒂芙尼旗舰店', 'The Landmark 旗舰店。', '727 Fifth Ave, New York, NY 10022'],
      ['品牌店', 'Cartier Fifth Avenue 卡地亚', '第五大道经典 Mansion 精品店。', '653 Fifth Ave, New York, NY 10022'],
      ['品牌店', 'Hermès Madison Avenue 爱马仕', 'Madison Avenue 精品店。', '706 Madison Ave, New York, NY 10065'],
      ['品牌店', 'Prada Fifth Avenue 普拉达', 'Prada 第五大道品牌店。', '724 Fifth Ave, New York, NY 10019'],
      ['品牌店', 'CHANEL 57th Street 香奈儿', 'CHANEL 纽约 57 街精品店。', '15 E 57th St, New York, NY 10022'],
      ['实用', '7大道地铁口', '布鲁克林 7 大道附近常用地铁入口。', 'Seventh Avenue & 62nd Street Brooklyn, NY 11220'],
      ['实用', '36街地铁口', '布鲁克林 36 街与第四大道附近地铁入口。', '36th Street & Fourth Avenue Brooklyn, NY 11232'],
      ['实用', '36街 Costco', '布鲁克林常用 Costco 仓储超市。', '976 3rd Ave Brooklyn, NY 11232']
    ];

    let category = 'all';
    let installPrompt;

    const list = document.getElementById('list');
    const searchInput = document.getElementById('q');
    const count = document.getElementById('count');

    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[char]));

    function mapUrl(address) {
      const encoded = encodeURIComponent(address);

      if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
        return `https://maps.apple.com/?q=${encoded}`;
      }

      if (/Android/.test(navigator.userAgent)) {
        return `geo:0,0?q=${encoded}`;
      }

      return `https://www.google.com/maps/search/?api=1&query=${encoded}`;
    }

    function render() {
      const keyword = searchInput.value.trim().toLowerCase();
      const items = PLACES.filter((place) => (
        (category === 'all' || place[0] === category) &&
        (!keyword || place.join(' ').toLowerCase().includes(keyword))
      ));

      count.textContent = `${items.length} 个地点`;

      list.innerHTML = items.length
        ? items.map((place) => `
          <article class="card" data-a="${escapeHtml(place[3])}" tabindex="0">
            <button class="copy" data-copy="${escapeHtml(place[3])}">复制</button>
            <div class="name">${escapeHtml(place[1])}</div>
            <div class="desc">${escapeHtml(place[2])}</div>
            <div class="address">${escapeHtml(place[3])}</div>
            <span class="tag">${escapeHtml(place[0])}</span>
          </article>
        `).join('')
        : '<div class="empty">没有找到相关地点</div>';
    }

    document.getElementById('tabs').onclick = (event) => {
      const button = event.target.closest('[data-c]');
      if (!button) return;

      category = button.dataset.c;
      document.querySelectorAll('.tab').forEach((item) => {
        item.classList.toggle('active', item === button);
      });
      render();
    };

    searchInput.oninput = render;

    list.onclick = async (event) => {
      const copyButton = event.target.closest('[data-copy]');
      if (copyButton) {
        event.stopPropagation();
        try {
          await navigator.clipboard.writeText(copyButton.dataset.copy);
          copyButton.textContent = '已复制';
          setTimeout(() => {
            copyButton.textContent = '复制';
          }, 1200);
        } catch (error) {
          // Keep the original button state if clipboard access fails.
        }
        return;
      }

      const card = event.target.closest('[data-a]');
      if (!card) return;

      const url = mapUrl(card.dataset.a);
      if (url.startsWith('geo:')) {
        location.href = url;
      } else {
        window.open(url, '_blank', 'noopener');
      }
    };

    // 分享交由统一顶部脚本处理。

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      installPrompt = event;
    });

    document.getElementById('install').onclick = async () => {
      if (installPrompt) {
        installPrompt.prompt();
        installPrompt = null;
        return;
      }

      const help = document.getElementById('help');
      help.style.display = 'block';
      help.textContent = /iPhone|iPad|iPod/.test(navigator.userAgent)
        ? 'iPhone / iPad：点击 Safari 分享按钮，再选择“添加到主屏幕”。'
        : '请使用浏览器菜单中的“安装应用”或“添加到主屏幕”。';
    };

    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw-nyc.js').catch(() => {});
      });
    }

    render();
  </script>

<script>
(function () {
  var button = document.getElementById('share-page');
  var toast = document.getElementById('share-toast');
  if (!button || !toast) return;

  var hideTimer;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('is-visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      toast.classList.remove('is-visible');
    }, 2200);
  }

  function fallbackCopy(url) {
    var field = document.createElement('textarea');
    field.value = url;
    field.setAttribute('readonly', '');
    field.style.position = 'fixed';
    field.style.left = '-9999px';
    document.body.appendChild(field);
    field.focus();
    field.select();
    var copied = false;
    try { copied = document.execCommand('copy'); } catch (error) {}
    field.remove();
    showToast(copied ? '页面链接已复制' : '请复制浏览器地址栏中的链接');
  }

  async function copyCurrentUrl() {
    var url = window.location.href;
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(url);
        showToast('页面链接已复制');
        return;
      } catch (error) {}
    }
    fallbackCopy(url);
  }

  button.addEventListener('click', async function () {
    if (typeof navigator.share === 'function') {
      try {
        await navigator.share({ title: document.title, url: window.location.href });
        return;
      } catch (error) {
        if (error && error.name === 'AbortError') return;
      }
    }
    await copyCurrentUrl();
  });
})();
</script>

</body>
</html>
