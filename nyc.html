  <script>
    const PLACES=[
      {category:'景点',name:'中央公园 Central Park',desc:'纽约最著名的城市公园之一，适合散步、拍照和休闲。',address:'Columbus Circle, New York, NY 10019'},

      {category:'景点',name:'自由女神 / Battery Park',desc:'前往自由女神游船常用出发区域，也可在公园看纽约港景色。',address:'Battery Park, New York, NY 10004'},

      {category:'景点',name:'布鲁克林大桥 Brooklyn Bridge',desc:'连接曼哈顿和布鲁克林的经典地标，适合步行看天际线。',address:'Brooklyn Bridge, New York, NY 10038'},
      {category:'景点',name:'DUMBO 经典拍照点',desc:'华盛顿街经典取景位，可拍到曼哈顿大桥。',address:'Washington St & Water St, Brooklyn, NY 11201'},
      {category:'景点',name:'法拉盛草原可乐娜公园',desc:'皇后区大型公园，著名地球仪 Unisphere 所在地。',address:'Flushing Meadows Corona Park, Queens, NY 11368'},
      {category:'景点',name:'罗斯福岛 Roosevelt Island',desc:'位于东河中的小岛，可坐缆车欣赏曼哈顿景色。',address:'Roosevelt Island, New York, NY 10044'},
      {category:'景点',name:'康尼岛 Coney Island',desc:'布鲁克林海滨休闲区，有沙滩、木板路和游乐设施。',address:'Coney Island Boardwalk, Brooklyn, NY 11224'},

      {category:'购物',name:'American Dream 美国梦购物中心',desc:'新泽西大型综合购物中心，购物、餐饮和室内娱乐集中。',address:'1 American Dream Way, East Rutherford, NJ 07073'},
      {category:'购物',name:'Roosevelt Field 罗斯福购物中心',desc:'长岛大型室内购物中心，品牌和百货店选择很多。',address:'630 Old Country Rd, Garden City, NY 11530'},
      {category:'购物',name:'Queens Center 皇后中心',desc:'皇后区常去大型商场，交通方便，购物和餐饮选择丰富。',address:'90-15 Queens Blvd, Elmhurst, NY 11373'},
      {category:'购物',name:'The Shops at Hudson Yards 哈德逊广场',desc:'曼哈顿西区大型购物中心，可和 Vessel、High Line 一起逛。',address:'20 Hudson Yards, New York, NY 10001'},
      {category:'购物',name:'Westfield World Trade Center 世贸购物中心',desc:'位于 Oculus 内，可和世贸中心、9·11 纪念馆一起游览。',address:'185 Greenwich St, New York, NY 10007'},
      {category:'购物',name:'Woodbury Common 名牌折扣村',desc:'纽约周边热门名牌 Outlet，适合买品牌折扣商品。',address:'498 Red Apple Ct, Central Valley, NY 10917'},
      {category:'购物',name:'Jersey Gardens 泽西花园',desc:'新泽西大型 Outlet 商场，距离纽约市较近。',address:'651 Kapkowski Rd, Elizabeth, NJ 07201'},

      {category:'品牌店',name:'Gucci Fifth Avenue 古驰第五大道店',desc:'Gucci 古驰纽约第五大道品牌旗舰店。',address:'725 Fifth Ave, New York, NY 10022'},
      {category:'品牌店',name:'Tiffany & Co. 蒂芙尼旗舰店',desc:'蒂芙尼纽约著名 The Landmark 旗舰店。',address:'727 Fifth Ave, New York, NY 10022'},
      {category:'品牌店',name:'Cartier Fifth Avenue 卡地亚',desc:'卡地亚纽约第五大道经典 Mansion 精品店。',address:'653 Fifth Ave, New York, NY 10022'},
      {category:'品牌店',name:'Hermès Madison Avenue 爱马仕',desc:'爱马仕纽约 Madison Avenue 精品店。',address:'706 Madison Ave, New York, NY 10065'},
      {category:'品牌店',name:'Prada Fifth Avenue 普拉达',desc:'Prada 普拉达第五大道品牌店。',address:'724 Fifth Ave, New York, NY 10019'},
      {category:'品牌店',name:'CHANEL 57th Street 香奈儿',desc:'CHANEL 香奈儿纽约 57 街精品店。',address:'15 E 57th St, New York, NY 10022'},

      {category:'实用',name:'7大道地铁口',desc:'布鲁克林 7 大道附近常用地铁入口位置。',address:'Seventh Avenue & 62nd Street Brooklyn, NY 11220'},
      {category:'实用',name:'36街地铁口',desc:'布鲁克林 36 街与第四大道附近地铁入口。',address:'36th Street & Fourth Avenue Brooklyn, NY 11232'},
      {category:'实用',name:'36街 Costco',desc:'布鲁克林常用 Costco 仓储超市。',address:'976 3rd Ave Brooklyn, NY 11232'}
    ];
    const LABELS={景点:'景点',购物:'购物商场',品牌店:'品牌直营店',实用:'实用地点'};
    const list=document.getElementById('list'),searchInput=document.getElementById('searchInput'),countText=document.getElementById('countText'),shareButton=document.getElementById('shareButton'),installButton=document.getElementById('installButton'),installHelp=document.getElementById('installHelp'),categoryTabs=document.getElementById('categoryTabs');let deferredInstallPrompt=null,activeCategory='all';
    function escapeHtml(v){return String(v||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
    function escapeAttribute(v){return escapeHtml(v).replaceAll('`','&#096;')}
    function mapUrl(address){const encoded=encodeURIComponent(address),isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent),isAndroid=/Android/i.test(navigator.userAgent);if(isAndroid)return `geo:0,0?q=${encoded}`;if(isIOS)return `https://maps.apple.com/?q=${encoded}`;return `https://www.google.com/maps/search/?api=1&query=${encoded}`}
    function openMap(address){const url=mapUrl(address);if(url.startsWith('geo:'))location.href=url;else window.open(url,'_blank','noopener,noreferrer')}
    async function copyText(value){if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(value);return true}catch(_){}}const textarea=document.createElement('textarea');textarea.value=value;textarea.setAttribute('readonly','');textarea.style.position='fixed';textarea.style.top='-9999px';document.body.appendChild(textarea);textarea.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}document.body.removeChild(textarea);return ok}
    function render(){const q=searchInput.value.trim().toLowerCase();const items=PLACES.filter(item=>(activeCategory==='all'||item.category===activeCategory)&&(!q||item.name.toLowerCase().includes(q)||item.desc.toLowerCase().includes(q)||item.address.toLowerCase().includes(q)||item.category.toLowerCase().includes(q)));countText.textContent=activeCategory==='all'?`${items.length} 个地点`:`${LABELS[activeCategory]} · ${items.length} 个`;if(!items.length){list.innerHTML='<div class="empty">没有找到相关地点</div>';return}list.innerHTML=items.map(item=>`<article class="card" role="link" tabindex="0" data-map="${escapeAttribute(item.address)}"><div class="card-inner"><span class="name">${escapeHtml(item.name)}</span><button class="copy-button" type="button" data-copy="${escapeAttribute(item.address)}" aria-label="复制地址">复制</button><span class="desc">${escapeHtml(item.desc)}</span><span class="address">${escapeHtml(item.address)}</span><span class="category">${escapeHtml(LABELS[item.category]||item.category)}</span></div></article>`).join('')}
    categoryTabs.addEventListener('click',event=>{const button=event.target.closest('[data-category]');if(!button)return;activeCategory=button.dataset.category;categoryTabs.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===button));render()});
    list.addEventListener('click',async event=>{const copyButton=event.target.closest('[data-copy]');if(copyButton){event.preventDefault();event.stopPropagation();const address=copyButton.getAttribute('data-copy')||'',ok=await copyText(address),original=copyButton.textContent;copyButton.textContent=ok?'已复制':'复制失败';setTimeout(()=>copyButton.textContent=original||'复制',1400);return}const card=event.target.closest('[data-map]');if(card)openMap(card.getAttribute('data-map')||'')});
    list.addEventListener('keydown',event=>{if(event.key!=='Enter'&&event.key!==' ')return;if(event.target.closest('[data-copy]'))return;const card=event.target.closest('[data-map]');if(!card)return;event.preventDefault();openMap(card.getAttribute('data-map')||'')});
    searchInput.addEventListener('input',render);
    function isInstalled(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}
    function showInstallHelp(text){installHelp.textContent=text;installHelp.style.display='block';installHelp.scrollIntoView({behavior:'smooth',block:'center'})}
    if(isInstalled()){installButton.textContent='已安装到桌面';installButton.disabled=true}
    window.addEventListener('beforeinstallprompt',event=>{event.preventDefault();deferredInstallPrompt=event;installButton.textContent='下载到桌面';installButton.disabled=false});
    window.addEventListener('appinstalled',()=>{deferredInstallPrompt=null;installButton.textContent='已安装到桌面';installButton.disabled=true;installHelp.style.display='none'});
    installButton.addEventListener('click',async()=>{if(isInstalled()){installButton.textContent='已安装到桌面';installButton.disabled=true;return}if(deferredInstallPrompt){deferredInstallPrompt.prompt();try{await deferredInstallPrompt.userChoice}catch(_){}deferredInstallPrompt=null;return}const ua=navigator.userAgent;if(/iPad|iPhone|iPod/.test(ua)){showInstallHelp('iPhone / iPad：点击 Safari 底部“分享”按钮，再选择“添加到主屏幕”。');return}if(/Android/i.test(ua)){showInstallHelp('Android：点击 Chrome 右上角菜单，再选择“安装应用”或“添加到主屏幕”。');return}if(/Edg\//.test(ua)){showInstallHelp('Edge：点击右上角“…” → 应用 → 将此站点安装为应用。');return}if(/Chrome\//.test(ua)){showInstallHelp('Chrome：点击地址栏右侧安装图标；或右上角“⋮” → 投放、保存和分享 → 将网页安装为应用。');return}showInstallHelp('当前浏览器没有提供直接安装提示，可使用浏览器菜单中的“安装应用”“添加到主屏幕”或“创建快捷方式”。')});
    if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('/sw-nyc.js').catch(()=>{}));
    shareButton.addEventListener('click',async()=>{const shareData={title:'OpenAA 纽约地址导航',text:'纽约景点 · 购物商场 · 品牌直营店 · 实用地点',url:location.href};if(navigator.share){try{await navigator.share(shareData);return}catch(_){}}const ok=await copyText(location.href);alert(ok?'链接已复制':'当前浏览器不支持分享，请手动复制地址栏链接。')});
    render();
  </script>
