name: Nav three-column desktop layout
on:
  push:
    paths:
      - '.github/workflows/nav-three-columns.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set desktop grids to three columns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [Path('nav/ai.html'), Path('nav/bank.html'), Path('nav/dmv.html'), Path('nav/onegobuy.html')]
          for p in files:
              s = p.read_text(encoding='utf-8')
              marker = '@media(max-width:380px){.grid{grid-template-columns:1fr}}'
              if marker not in s:
                  raise SystemExit(f'Expected mobile grid rule not found in {p}')
              replacement = '@media(min-width:769px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}' + marker
              p.write_text(s.replace(marker, replacement, 1), encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/nav-three-columns.yml
          git add nav/ai.html nav/bank.html nav/dmv.html nav/onegobuy.html
          git commit -m "Use three columns on nav desktop pages"
          git push