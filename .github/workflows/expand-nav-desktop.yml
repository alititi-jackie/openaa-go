name: Expand nav desktop width
on:
  push:
    paths:
      - '.github/workflows/expand-nav-desktop.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalize nav desktop width
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
              Path('nav/ai.html'),
              Path('nav/bank.html'),
              Path('nav/dmv.html'),
              Path('nav/nyc.html'),
              Path('nav/onegobuy.html'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              old = '.shell{max-width:760px'
              if old not in s:
                  raise SystemExit(f'Expected width rule not found in {p}')
              p.write_text(s.replace(old, '.shell{max-width:960px', 1), encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/expand-nav-desktop.yml
          git add nav/ai.html nav/bank.html nav/dmv.html nav/nyc.html nav/onegobuy.html
          git commit -m "Widen nav pages for desktop"
          git push